[package]
name = "statusskarm"
version = "0.1.0"
edition = "2021"
description = "Fullskärmsstatus för robotens Pi (5\" touchskärm): styrkort, Car_Client, internet, RTK, CPU"

[dependencies]
# Samma GUI-bibliotek som robotstyrning-klienten.
eframe = "0.27"
# Klockan i toppremsan (lokal tid).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
